services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: rom
            POSTGRES_PASSWORD: rom
            POSTGRES_DB: rom
        ports:
            - "5432:5432"
        volumes:
            - rom_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rom -d rom"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    rom_pgdata:
